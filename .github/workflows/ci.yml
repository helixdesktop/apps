name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Build libraries, plus what the tests use at runtime: a private D-Bus
      # (dbus-daemon), GStreamer elements (fakesink, audiotestsrc, rgvolume),
      # SANE's test backend, tracker3, Evolution Data Server's daemons,
      # fonts, glib-compile-schemas, PipeWire with the PulseAudio tools for
      # the fake audio session (crates/helix-test-audio), and GTK's IBus
      # module for the input-method tests (crates/helix-test-ime; the
      # IBus daemon itself is a fake on a private bus), and gtk4-broadwayd
      # (libgtk-4-bin), the private headless display of the GTK UI tests.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev libpoppler-glib-dev \
            libshumate-dev libsane-dev \
            dbus dbus-daemon libglib2.0-bin desktop-file-utils gettext \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libsane1 tracker evolution-data-server \
            pipewire-bin libpipewire-0.3-modules libspa-0.2-modules pulseaudio-utils \
            ibus-gtk4 libgtk-4-bin \
            fontconfig fonts-dejavu-core \
            gdb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Tests start their buses through helix_app_common::test_bus or
      # tools/testing/session.conf, which can start no real services.
      - name: Check test buses
        run: tools/testing/check-test-buses.sh

      # Headless, on a private session bus that can start no services, with
      # in-memory GSettings, so no test can reach a display, a user bus, a
      # real service or real settings. HELIX_REQUIRE_GTK makes a GTK UI test
      # that can't start its Broadway display fail instead of skipping (#201).
      - name: Test
        env:
          HELIX_REQUIRE_GTK: "1"
        run: tools/testing/run-tests.sh cargo test --workspace --locked

      # The helix-eds tests against real Evolution Data Server daemons on a
      # private bus with scratch data, one test at a time: Ubuntu 24.04's
      # evolution-source-registry (3.52) has crashed with the tests sharing
      # it in parallel. If a daemon still crashes, its core file is kept in
      # /tmp and the script prints a backtrace (symbols from Ubuntu's
      # debuginfod).
      - name: Test against Evolution Data Server
        env:
          EDS_CORES: /tmp/eds-core
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/eds-core.%e.%p
          crates/helix-eds/tests/run-private-eds.sh cargo test -p helix-eds --test private_bus --locked -- --test-threads=1

      # The extractor leaves test-only strings out and keeps the rest.
      - name: Test the i18n tools
        run: python3 tools/i18n/test_extract_rs.py

      # po/POTFILES and the template must match the sources.
      - name: Check translation template
        run: tools/i18n/update-pot.sh --check

      # Every catalogue compiles and keeps the placeholders, markup and
      # access keys of the original messages.
      - name: Check translations
        run: python3 tools/i18n/check-po.py

      - name: Check schemas
        run: |
          dir=$(mktemp -d)
          cp apps/*/data/*.gschema.xml "$dir"/
          glib-compile-schemas --strict "$dir"

      # OnlyShowIn=Helix is intended (XDG_CURRENT_DESKTOP is "Helix:GNOME")
      # even though Helix is not a registered desktop name.
      - name: Check desktop files
        run: |
          out=$(for f in apps/*/data/*.desktop; do desktop-file-validate "$f"; done 2>&1 \
            | grep ': error: ' | grep -v 'unregistered value "Helix"' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Check packaging layout
        run: |
          sudo apt-get install -y --no-install-recommends jq
          cargo build --workspace --bins --locked
          BIN_DIR=target/debug packaging/stage.sh "$RUNNER_TEMP/stage"
          find "$RUNNER_TEMP/stage" -type f | sort
